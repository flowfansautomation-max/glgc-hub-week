<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLGC — Hub &amp; Sunday Attendance · Slideshow</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="data.js?v=7"></script>
  <style>
    :root { --blue:#1f5fff; --gold:#e6c878; --red:#e2574c; --sun:#f5c518; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:#000; color:#fff; font-family:Arial, Helvetica, sans-serif; }

    .top { display:flex; gap:10px; justify-content:center; align-items:center; padding:12px 16px 4px; flex-wrap:wrap; }
    .nav { display:flex; gap:10px; flex-wrap:wrap; }
    .nav a { color:#bbb; text-decoration:none; border:1px solid #333; border-radius:20px; padding:7px 16px; font-size:14px; }
    .nav a.active { background:var(--gold); color:#000; border-color:var(--gold); font-weight:bold; }
    select { background:#111; color:#fff; border:1px solid #333; border-radius:8px; padding:8px 12px; font-size:14px; max-width:260px; }
    .pdfbtn { background:var(--gold); color:#000; border:1px solid var(--gold); border-radius:20px; padding:8px 16px;
      font-size:14px; font-weight:bold; cursor:pointer; font-family:inherit; }
    .pdfbtn:disabled { opacity:.5; cursor:default; }
    .prog { color:var(--gold); font-size:13px; }

    .navbtn { position:fixed; top:50%; transform:translateY(-50%); z-index:5;
      width:56px; height:110px; border:1px solid #333; background:#141414cc; color:var(--gold);
      font-size:44px; line-height:1; border-radius:12px; cursor:pointer; }
    .navbtn:hover { background:#222; }
    .navbtn.prev { left:14px; } .navbtn.next { right:14px; }
    .navbtn:disabled { opacity:.25; cursor:default; }

    .stage { max-width:1180px; margin:0 auto; padding:6px 76px 50px; }
    .header { text-align:center; margin:12px 0 4px; }
    .header .gname { font-family:Georgia,'Times New Roman',serif; color:var(--gold);
      font-size:38px; font-weight:bold; letter-spacing:.5px; display:block; }
    .header .gchoirs { color:#d8c286; font-size:13px; margin-top:8px; max-width:900px; margin-left:auto; margin-right:auto; }
    .header .prog { color:#888; font-size:13px; margin-top:6px; }

    .totrow { display:flex; gap:12px; justify-content:center; margin:14px 0 2px; flex-wrap:wrap; }
    .tot { font-size:14px; font-weight:bold; padding:7px 16px; border-radius:22px; }
    .tot.reh { background:rgba(31,95,255,.16); color:#8fb0ff; border:1px solid #2b52b8; }
    .tot.sun { background:rgba(245,197,24,.14); color:var(--sun); border:1px solid #7d6a1b; }
    .tot.def { background:rgba(226,87,76,.14); color:#f2938b; border:1px solid #8a3730; }

    .section { margin-top:18px; }
    .section-label { display:inline-block; background:#161616; border:1px solid #333;
      border-left:4px solid var(--gold); border-radius:8px; padding:7px 16px;
      font-size:15px; font-weight:bold; letter-spacing:.5px; }
    .legend { display:flex; gap:24px; margin:12px 2px 2px; color:#cfcfcf; font-size:14px; flex-wrap:wrap; }
    .legend span { display:inline-flex; align-items:center; gap:8px; }
    .sw { width:22px; height:12px; border-radius:2px; display:inline-block; }
    .chartscroll { overflow-x:auto; }
    .chartinner { height:360px; min-width:100%; }

    /* defaulter panels — two side by side */
    .defgrid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
    @media (max-width:760px){ .defgrid { grid-template-columns:1fr; } }
    .defcol .section-label { border-left-color:var(--red); }
    .defcol .section-label.reh { border-left-color:var(--blue); }
    .defaulters { margin-top:10px; border:1px solid #2a2a2a; border-radius:12px; overflow:hidden; }
    .def-row { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #1e1e1e; }
    .def-row:last-child { border-bottom:none; }
    .def-row .dot { width:9px; height:9px; border-radius:50%; background:var(--red); flex:none; }
    .def-row .who { font-weight:bold; font-size:14px; }
    .def-row .reason { margin-left:auto; font-size:12px; color:#f2938b; background:rgba(226,87,76,.12);
      border:1px solid #6e2c26; padding:3px 10px; border-radius:20px; white-space:nowrap; }
    .def-none { padding:16px 14px; text-align:center; color:#8fd6a8; font-size:14px; }
    .def-none b { color:#b6f0c6; }
    .def-all { padding:14px; color:#f2938b; font-size:14px; }
    .def-all b { color:#ffb3ab; }

    @media (max-width:820px){
      .stage { padding:6px 12px 50px; }
      .header .gname { font-size:28px; }
      .navbtn { width:40px; height:64px; font-size:30px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="nav">
      <a href="slides.html" class="active">Slideshow</a>
      <a href="summary.html">Weekly Summary</a>
    </div>
    <select id="jump" onchange="goTo(+this.value)"></select>
    <button class="pdfbtn" id="pdfBtn" onclick="generatePDF()">⤓ Download PDF</button>
    <span class="prog" id="pdfProg" style="display:none"></span>
  </div>

  <button class="navbtn prev" id="prev" onclick="step(-1)">‹</button>
  <button class="navbtn next" id="next" onclick="step(1)">›</button>

  <div class="stage">
    <div class="header">
      <span class="gname" id="gname"></span>
      <div class="gchoirs" id="gchoirs"></div>
      <div class="prog" id="prog"></div>
    </div>

    <div class="totrow" id="totrow"></div>

    <div class="section">
      <div class="section-label" id="chartLabel">🎼 Rehearsal vs Sunday Attendance</div>
      <div class="legend" id="legend"></div>
      <div class="chartscroll"><div class="chartinner" id="chartinner"><canvas id="chart"></canvas></div></div>
    </div>

    <div class="defgrid">
      <div class="defcol">
        <div class="section-label reh">🚩 Rehearsal defaulters — no rehearsal data</div>
        <div id="rehDef"></div>
      </div>
      <div class="defcol">
        <div class="section-label">🚩 Sunday defaulters — no Sunday data</div>
        <div id="sunDef"></div>
      </div>
    </div>
  </div>

  <script>
  const valueLabels = { id:'valueLabels', afterDatasetsDraw:function(chart){
    const ctx=chart.ctx;
    chart.data.datasets.forEach(function(ds,di){
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      meta.data.forEach(function(bar,i){
        const v=ds.data[i]; if(v==null) return;
        ctx.save(); ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
        ctx.fillText(v, bar.x, bar.y-5); ctx.restore();
      });
    });
  }};

  const xAxis = { ticks:{color:'#ddd',font:{size:11},maxRotation:60,minRotation:35}, grid:{color:'#1e1e1e'} };
  const yAxis = { beginAtZero:true, grace:'16%', ticks:{color:'#ddd',precision:0},
    title:{display:true,text:'People',color:'#888'}, grid:{color:'#1e1e1e'} };

  let idx = 0, chart = null;

  (function(){
    const jump = document.getElementById('jump');
    GROUPS.forEach(function(g,i){
      const o=document.createElement('option'); o.value=i; o.textContent=(i+1)+'. '+g.name; jump.appendChild(o);
    });
  })();

  function step(d){ goTo(idx+d); }
  function goTo(i){
    idx = Math.max(0, Math.min(GROUPS.length-1, i));
    document.getElementById('jump').value = idx;
    document.getElementById('prev').disabled = idx===0;
    document.getElementById('next').disabled = idx===GROUPS.length-1;
    render(GROUPS[idx]);
    if (history.replaceState) history.replaceState(null,'','#'+GROUPS[idx].id);
  }
  document.addEventListener('keydown', function(e){
    if (e.target.tagName==='SELECT') return;
    if (e.key==='ArrowRight') step(1); else if (e.key==='ArrowLeft') step(-1);
  });

  // render a defaulter list for one metric; collapses to a banner when the whole group defaulted
  function defHTML(rows, defs, metricLabel){
    if (!defs.length)
      return '<div class="defaulters"><div class="def-none">✅ <b>None</b> — every pair submitted '+metricLabel+'.</div></div>';
    if (defs.length === rows.length)
      return '<div class="defaulters"><div class="def-all">⚠ <b>Whole group</b> — no '+metricLabel+' submitted ('+defs.length+' pairs).</div></div>';
    return '<div class="defaulters">' + defs.map(function(r){
      return '<div class="def-row"><span class="dot"></span><span class="who">'+r.label+'</span>' +
        '<span class="reason">'+(r.note || 'Not submitted')+'</span></div>';
    }).join('') + '</div>';
  }

  function render(g){
    const rows = g.rows;
    const tReh = GLGC.sum(rows,'reh');
    const tSun = GLGC.sum(rows,'sun');
    const hasSun = GLGC.has(rows,'sun');
    const rehDefs = GLGC.defaulters(rows,'reh');
    const sunDefs = GLGC.defaulters(rows,'sun');

    document.getElementById('gname').textContent = g.name;
    document.getElementById('gchoirs').textContent = 'Choirs: ' + GLGC.choirs(rows).map(function(c){return c.gov+' ('+c.n+')';}).join('   ·   ');
    document.getElementById('prog').textContent = 'Group ' + (idx+1) + ' of ' + GROUPS.length;

    document.getElementById('totrow').innerHTML =
      '<span class="tot reh">Rehearsal ' + tReh + '</span>' +
      (hasSun ? '<span class="tot sun">Sunday ' + tSun + '</span>' : '') +
      '<span class="tot def">Reh defaulters ' + rehDefs.length + '</span>' +
      '<span class="tot def">Sun defaulters ' + sunDefs.length + '</span>';

    document.getElementById('chartLabel').textContent =
      (hasSun ? '🎼 Rehearsal vs Sunday Attendance' : '🎼 Rehearsal Attendance');
    document.getElementById('legend').innerHTML =
      '<span><i class="sw" style="background:var(--blue)"></i> Rehearsal (hub)</span>' +
      (hasSun ? '<span><i class="sw" style="background:var(--sun)"></i> Sunday attendance</span>' : '');

    const inner = document.getElementById('chartinner');
    inner.style.minWidth = Math.max(680, rows.length*82) + 'px';

    const datasets = [
      { label:'Rehearsal (hub)', data:rows.map(r=>r.reh==null?0:r.reh),
        backgroundColor:'#1f5fff', borderRadius:3, maxBarThickness:40 }
    ];
    if (hasSun) datasets.push(
      { label:'Sunday attendance', data:rows.map(r=>r.sun==null?0:r.sun),
        backgroundColor:'#f5c518', borderRadius:3, maxBarThickness:40 });

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type:'bar', plugins:[valueLabels],
      data:{ labels:rows.map(r=>r.label), datasets:datasets },
      options:{ responsive:true, maintainAspectRatio:false, animation:{duration:350},
        plugins:{ legend:{display:false} }, scales:{ x:xAxis, y:yAxis } }
    });

    document.getElementById('rehDef').innerHTML = defHTML(rows, rehDefs, 'rehearsal data');
    document.getElementById('sunDef').innerHTML = defHTML(rows, sunDefs, 'Sunday data');
  }

  /* ===== PDF export: one page per group + a final summary page ===== */
  // paints the offscreen canvas black so exported charts match the dark theme
  const blackBg = { id:'blackBg', beforeDraw:function(c){ const x=c.ctx; x.save(); x.fillStyle='#000'; x.fillRect(0,0,c.width,c.height); x.restore(); } };

  function chartImage(config){
    return new Promise(function(res){
      const cv=document.createElement('canvas'); cv.width=1500; cv.height=560;
      cv.style.position='fixed'; cv.style.left='-99999px'; cv.style.top='0';
      document.body.appendChild(cv);
      const ch=new Chart(cv, config);
      setTimeout(function(){ const d=ch.toBase64Image('image/jpeg',0.92); ch.destroy(); cv.remove(); res(d); }, 90);
    });
  }
  function groupChartConfig(rows, hasSun){
    const datasets=[{ label:'Rehearsal', data:rows.map(r=>r.reh==null?0:r.reh),
      backgroundColor:'#1f5fff', borderRadius:3, maxBarThickness:46 }];
    if(hasSun) datasets.push({ label:'Sunday', data:rows.map(r=>r.sun==null?0:r.sun),
      backgroundColor:'#f5c518', borderRadius:3, maxBarThickness:46 });
    return { type:'bar', plugins:[valueLabels, blackBg],
      data:{ labels:rows.map(r=>r.label), datasets:datasets },
      options:{ responsive:false, animation:false, plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:'#ddd',font:{size:12},maxRotation:55,minRotation:35}, grid:{color:'#1e1e1e'} },
                 y:{ beginAtZero:true, grace:'16%', ticks:{color:'#ddd',precision:0}, grid:{color:'#1e1e1e'} } } } };
  }
  function summaryChartConfig(agg){
    return { type:'bar', plugins:[valueLabels, blackBg],
      data:{ labels:agg.map(a=>a.name), datasets:[
        { label:'Rehearsal', data:agg.map(a=>a.reh), backgroundColor:'#1f5fff', borderRadius:4, maxBarThickness:80 },
        { label:'Sunday', data:agg.map(a=>a.sun), backgroundColor:'#f5c518', borderRadius:4, maxBarThickness:80 } ]},
      options:{ responsive:false, animation:false, plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:'#ddd',font:{size:14}}, grid:{color:'#1e1e1e'} },
                 y:{ beginAtZero:true, grace:'14%', ticks:{color:'#ddd',precision:0}, grid:{color:'#1e1e1e'} } } } };
  }

  // draws a defaulter list into a column; returns the y after the last row
  function drawDefList(doc, title, accent, defs, x, y, colW){
    doc.setTextColor(accent[0],accent[1],accent[2]); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(title, x, y); y+=6;
    doc.setFontSize(9.5);
    if(!defs.length){ doc.setTextColor(150,220,170); doc.setFont('helvetica','normal');
      doc.text('None — every pair submitted.', x, y); return y+6; }
    defs.forEach(function(r){
      doc.setTextColor(226,120,110); doc.setFont('helvetica','bold');
      doc.text('•', x, y);
      doc.setTextColor(235,235,235); doc.setFont('helvetica','normal');
      const name=doc.splitTextToSize(r.label, colW-46)[0];
      doc.text(name, x+4, y);
      doc.setTextColor(190,150,150); doc.setFont('helvetica','italic'); doc.setFontSize(8);
      doc.text(r.note||'Not submitted', x+colW, y, {align:'right'});
      doc.setFontSize(9.5);
      y+=5.4;
    });
    return y;
  }

  async function generatePDF(){
    const btn=document.getElementById('pdfBtn'), prog=document.getElementById('pdfProg');
    btn.disabled=true; prog.style.display='inline'; prog.textContent='Generating…';
    try{
      const jsPDF=window.jspdf.jsPDF;
      const doc=new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
      const W=297, H=210, M=14;

      for(let gi=0; gi<GROUPS.length; gi++){
        const g=GROUPS[gi], rows=g.rows;
        const tReh=GLGC.sum(rows,'reh'), tSun=GLGC.sum(rows,'sun'), hasSun=GLGC.has(rows,'sun');
        const rehDefs=GLGC.defaulters(rows,'reh'), sunDefs=GLGC.defaulters(rows,'sun');
        if(gi>0) doc.addPage();
        doc.setFillColor(0,0,0); doc.rect(0,0,W,H,'F');
        // heading
        doc.setTextColor(230,200,120); doc.setFont('times','bold'); doc.setFontSize(24);
        doc.text(g.name, W/2, 16, {align:'center'});
        doc.setTextColor(180,180,180); doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
        doc.text('Rehearsal '+tReh+'    ·    '+(hasSun?('Sunday '+tSun+'    ·    '):'')+
          'Reh defaulters '+rehDefs.length+'    ·    Sun defaulters '+sunDefs.length, W/2, 24, {align:'center'});
        // chart
        const img=await chartImage(groupChartConfig(rows, hasSun));
        doc.addImage(img,'JPEG', M, 29, W-2*M, 92);
        // defaulter columns
        const colW=(W-2*M-10)/2;
        drawDefList(doc, 'Rehearsal defaulters ('+rehDefs.length+')', [143,176,255], rehDefs, M, 132, colW);
        drawDefList(doc, 'Sunday defaulters ('+sunDefs.length+')', [242,147,139], sunDefs, M+colW+10, 132, colW);
        // footer
        doc.setTextColor(120,120,120); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        doc.text('GLGC · Experience Service · 27 Jul 2026', M, H-8);
        doc.text('Group '+(gi+1)+' of '+GROUPS.length, W-M, H-8, {align:'right'});
        prog.textContent='Generating… '+(gi+1)+'/'+(GROUPS.length+1);
      }

      // ===== summary page =====
      const agg=GROUPS.map(function(g){ return { name:g.name, reh:GLGC.sum(g.rows,'reh'), sun:GLGC.sum(g.rows,'sun'),
        pairs:g.rows.length, rehDef:GLGC.defaulters(g.rows,'reh').length, sunDef:GLGC.defaulters(g.rows,'sun').length }; });
      const T=agg.reduce(function(a,x){ a.reh+=x.reh;a.sun+=x.sun;a.pairs+=x.pairs;a.rehDef+=x.rehDef;a.sunDef+=x.sunDef;return a; },
        {reh:0,sun:0,pairs:0,rehDef:0,sunDef:0});
      doc.addPage(); doc.setFillColor(0,0,0); doc.rect(0,0,W,H,'F');
      doc.setTextColor(230,200,120); doc.setFont('times','bold'); doc.setFontSize(24);
      doc.text('Weekly Summary', W/2, 16, {align:'center'});
      doc.setTextColor(160,160,160); doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Experience Service · 27 July 2026', W/2, 23, {align:'center'});
      // KPI row
      const kpis=[['Total Rehearsal',T.reh,[143,176,255]],['Total Sunday',T.sun,[245,197,24]],
        ['Reh Defaulters',T.rehDef,[226,120,110]],['Sun Defaulters',T.sunDef,[226,120,110]]];
      const kw=(W-2*M-3*6)/4;
      kpis.forEach(function(k,i){ const x=M+i*(kw+6);
        doc.setDrawColor(40,40,40); doc.setFillColor(14,14,14); doc.roundedRect(x,29,kw,22,2,2,'FD');
        doc.setTextColor(140,140,140); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
        doc.text(k[0].toUpperCase(), x+5, 36);
        doc.setTextColor(k[2][0],k[2][1],k[2][2]); doc.setFontSize(20); doc.text(String(k[1]), x+5, 47);
      });
      // summary chart
      const simg=await chartImage(summaryChartConfig(agg));
      doc.addImage(simg,'JPEG', M, 56, W-2*M, 78);
      // totals table
      let ty=142;
      const cols=[M, M+95, M+130, M+168, M+210, M+250];
      const heads=['Group','Rehearsal','Sunday','Pairs','Reh def','Sun def'];
      doc.setTextColor(150,150,150); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      heads.forEach(function(h,i){ doc.text(h, cols[i], ty, i===0?{}:{align:'right'}); });
      ty+=2; doc.setDrawColor(50,50,50); doc.line(M, ty, W-M, ty); ty+=6;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      agg.forEach(function(a){
        doc.setTextColor(235,235,235); doc.text(a.name, cols[0], ty);
        doc.setTextColor(143,176,255); doc.text(String(a.reh), cols[1], ty, {align:'right'});
        doc.setTextColor(245,197,24); doc.text(String(a.sun), cols[2], ty, {align:'right'});
        doc.setTextColor(200,200,200); doc.text(String(a.pairs), cols[3], ty, {align:'right'});
        doc.setTextColor(242,147,139); doc.text(String(a.rehDef), cols[4], ty, {align:'right'});
        doc.text(String(a.sunDef), cols[5], ty, {align:'right'});
        ty+=6.5;
      });
      ty+=1; doc.setDrawColor(80,80,80); doc.setLineWidth(0.5); doc.line(M, ty, W-M, ty); ty+=6;
      doc.setFont('helvetica','bold');
      doc.setTextColor(255,255,255); doc.text('Week total', cols[0], ty);
      doc.setTextColor(143,176,255); doc.text(String(T.reh), cols[1], ty, {align:'right'});
      doc.setTextColor(245,197,24); doc.text(String(T.sun), cols[2], ty, {align:'right'});
      doc.setTextColor(200,200,200); doc.text(String(T.pairs), cols[3], ty, {align:'right'});
      doc.setTextColor(242,147,139); doc.text(String(T.rehDef), cols[4], ty, {align:'right'});
      doc.text(String(T.sunDef), cols[5], ty, {align:'right'});
      doc.setTextColor(120,120,120); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text('GLGC · Hub & Sunday Attendance', M, H-8);
      doc.text('Summary · '+(GROUPS.length+1)+' of '+(GROUPS.length+1), W-M, H-8, {align:'right'});

      doc.save('GLGC-Hub-Sunday-Attendance-27Jul2026.pdf');
      prog.textContent='Done ✓';
      setTimeout(function(){ prog.style.display='none'; }, 2500);
    } catch(e){
      console.error(e); prog.textContent='PDF failed — see console';
    } finally { btn.disabled=false; }
  }

  (function(){
    const h = (location.hash||'').replace('#','');
    const start = GROUPS.findIndex(g=>g.id===h);
    goTo(start<0?0:start);
  })();
  </script>
</body>
</html>
